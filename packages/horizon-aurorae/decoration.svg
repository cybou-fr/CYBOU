Cybou Horizon window frame.

Aurorae reads this as a Plasma FrameSvg: every element id below is required, and the nine
"decoration-*" pieces are stretched around the window. The "decoration-inactive-*" set is the
same frame with lower contrast, so an unfocused window recedes without changing shape
(docs/04-desktop-layout.md).

The active window carries a thin accent edge along the top - the horizon line, applied to a
window. Colours are the dark tokens: surface #171D27, border #2E394A, accent #70E1C8.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="240" viewBox="0 0 120 240">
  <!-- active frame -->
  <rect id="decoration-topleft"     x="0"  y="0"  width="10" height="34" fill="#171D27"/>
  <rect id="decoration-top"         x="10" y="0"  width="20" height="34" fill="#171D27"/>
  <rect id="decoration-topright"    x="30" y="0"  width="10" height="34" fill="#171D27"/>
  <rect id="decoration-left"        x="0"  y="34" width="1"  height="20" fill="#2E394A"/>
  <rect id="decoration-center"      x="10" y="34" width="20" height="20" fill="#171D27"/>
  <rect id="decoration-right"       x="39" y="34" width="1"  height="20" fill="#2E394A"/>
  <rect id="decoration-bottomleft"  x="0"  y="54" width="10" height="1"  fill="#2E394A"/>
  <rect id="decoration-bottom"      x="10" y="54" width="20" height="1"  fill="#2E394A"/>
  <rect id="decoration-bottomright" x="30" y="54" width="10" height="1"  fill="#2E394A"/>

  <!-- the accent edge that marks focus; one line, no glow -->
  <rect x="0" y="0" width="40" height="1" fill="#70E1C8" opacity="0.55"/>

  <!-- inactive frame: same geometry, lower contrast, no accent -->
  <rect id="decoration-inactive-topleft"     x="60"  y="0"  width="10" height="34" fill="#10151D"/>
  <rect id="decoration-inactive-top"         x="70"  y="0"  width="20" height="34" fill="#10151D"/>
  <rect id="decoration-inactive-topright"    x="90"  y="0"  width="10" height="34" fill="#10151D"/>
  <rect id="decoration-inactive-left"        x="60"  y="34" width="1"  height="20" fill="#202938"/>
  <rect id="decoration-inactive-center"      x="70"  y="34" width="20" height="20" fill="#10151D"/>
  <rect id="decoration-inactive-right"       x="99"  y="34" width="1"  height="20" fill="#202938"/>
  <rect id="decoration-inactive-bottomleft"  x="60"  y="54" width="10" height="1"  fill="#202938"/>
  <rect id="decoration-inactive-bottom"      x="70"  y="54" width="20" height="1"  fill="#202938"/>
  <rect id="decoration-inactive-bottomright" x="90"  y="54" width="10" height="1"  fill="#202938"/>
</svg>
