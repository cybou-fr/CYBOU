[package]
name = "living-canvas"
description = "The shared Rust/WASM Cybou frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
cybou-protocol = { path = "../cybou-protocol" }
cybou-web-contracts = { path = "../cybou-web-contracts" }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
# The lease instants on a session are `OffsetDateTime`, and a card that showed them has to format
# them. No clock is wanted or available in the browser: `now_utc` is not enabled here, which is why
# the Agents card shows two instants rather than a countdown that would tick without one.
time.workspace = true
uuid.workspace = true

# Native-only: the workspace tokio carries `net`, and mio refuses to build for wasm32. The browser
# tests below need none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

# The desktop's interaction logic only exists on wasm32, so the only place it can be exercised is a
# browser. Pinned to the same wasm-bindgen the frontend builds against: the runner and the bindings
# must agree exactly or the harness refuses to start.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# `uuid` arrives transitively through cybou-protocol with `v4` enabled; on wasm32-unknown-unknown
# it refuses to compile until a randomness source is named, so enable the browser one here.
uuid = { workspace = true, features = ["js"] }
gloo-net = "0.6.0"
leptos = { version = "0.8.15", features = ["csr"] }
lucide-leptos = { version = "3.23.0", features = ["account", "files", "layout", "multimedia", "navigation", "security", "text"] }
# Keep the generated bindings aligned with the exact CLI shipped by pinned nixpkgs-26.05.
js-sys = "=0.3.103"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = [
    "Clipboard",
    "BeforeUnloadEvent",
    "DomRect",
    "Element",
    "EventSource",
    "EventTarget",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    # For the browser interaction gate, which counts the cards a mount actually drew.
    "NodeList",
    "PointerEvent",
    "Storage",
    "Window",
] }

[lints]
workspace = true
