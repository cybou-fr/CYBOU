[package]
name = "cybou-actiond"
description = "Action1 proposal lifecycle, criticism, policy decisions, and single-use permits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ciborium.workspace = true
cybou-fabric = { path = "../cybou-fabric" }
cybou-protocol = { path = "../cybou-protocol" }
cybou-remediation = { path = "../cybou-remediation" }
serde.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
# Only the example probe uses this, to put a finding in the Journal the way the organ that observes
# findings does. Telemetry is above governance in ADR-0029's order, so reading it is permitted.
cybou-telemetryd = { path = "../cybou-telemetryd" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
