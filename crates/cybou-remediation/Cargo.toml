[package]
name = "cybou-remediation"
description = "Typed remediation proposals and the authorization gate that refuses them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The protocol and nothing else. This crate decides what may happen; a dependency on something that
# could make it happen would put the gate and the thing it gates in one place.
cybou-protocol = { path = "../cybou-protocol" }
serde.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
# The S0 walkthrough lives here because this is the end of the chain: governance may read meaning
# and telemetry, and neither may read governance. Development-only — nothing in the gate depends on
# an organ at run time.
cybou-meaning = { path = "../cybou-meaning" }
cybou-telemetryd = { path = "../cybou-telemetryd" }

[lints]
workspace = true
