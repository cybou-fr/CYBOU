[package]
name = "cybou-perceptiond"
description = "Grounded system perception and observation daemon for Cybou"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ciborium.workspace = true
cybou-fabric = { path = "../cybou-fabric" }
cybou-perception = { path = "../cybou-perception" }
cybou-protocol = { path = "../cybou-protocol" }
cybou-runtime = { path = "../cybou-runtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
