[package]
name = "cybou-web-gateway"
description = "Bounded browser boundary for Cybou Presence and governed desktop capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
ciborium.workspace = true
cybou-fabric = { path = "../cybou-fabric" }
cybou-jailfs = { path = "../cybou-jailfs" }
cybou-host-filesd = { path = "../cybou-host-filesd" }
cybou-personald = { path = "../cybou-personald" }
# The gateway is where telemetry, meaning and the authorization gate meet. None of the three reads
# the others; putting the join here is what keeps that true.
cybou-meaning = { path = "../cybou-meaning" }
cybou-protocol = { path = "../cybou-protocol" }
cybou-remediation = { path = "../cybou-remediation" }
cybou-telemetryd = { path = "../cybou-telemetryd" }
cybou-web-contracts = { path = "../cybou-web-contracts" }
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
rustix.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The disclosure walkthrough follows one observation from perception to the bytes a reader
# receives. Development-only: the gateway must not depend on the organs it reads over D-Bus, and
# this test exists to hold the composition none of them owns.
cybou-epistemicd = { path = "../cybou-epistemicd" }
cybou-perception = { path = "../cybou-perception" }
http-body-util.workspace = true
tempfile = "3.23.0"
tower.workspace = true

[lints]
workspace = true
