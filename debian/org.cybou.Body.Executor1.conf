<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.cybou.Mind.Action1"/>
    <deny send_destination="org.cybou.Mind.Action1"/>
    <deny own="org.cybou.Body.Executor1"/>
    <deny send_destination="org.cybou.Body.Executor1"/>
  </policy>

  <!-- Only the root executor may own the Body endpoint. -->
  <policy user="root">
    <allow own="org.cybou.Body.Executor1"/>
    <allow send_destination="org.cybou.Mind.Action1"/>
  </policy>

  <!-- Cybou can present an opaque permit identity; it cannot supply an operation or arguments. -->
  <policy user="cybou">
    <allow own="org.cybou.Mind.Action1"/>
    <allow send_destination="org.cybou.Body.Executor1"/>
  </policy>
</busconfig>
