#
# Cybou CI — see docs/TESTING.md and docs/adr/ADR-0004-ci-workflow.md.
#
# There is one product and one toolchain now, so there is one story here:
#
#   code        -> the Rust workspace and the WASM frontend compile, test and lint
#   desktop     -> the desktop's interaction logic, run in a browser because that is where it lives
#   integration -> the twelve daemons start on a session bus and answer as a system
#   compliance  -> licence headers, the documents this repository declares authoritative, and
#                  that every class the desktop renders has a rule to be drawn by
#
# What used to be here and is gone with the code it checked: Nix builds of the C++/QML Plasma
# packages, the NixOS VM, and the Qt compatibility oracles. Nothing installs those packages, and
# no Journal written by the Qt implementation exists, so they proved compatibility with a past
# that has no data in it. The canonical byte fixtures they produced stay in fixtures/, and the
# Rust tests still verify against them.
#
# The integration gate used to run only on the Debian builder, which meant the one place the Mind
# is exercised as a system was also the one place nobody ran on a push. It needs a session bus and
# twelve running daemons, and an Ubuntu runner has both dbus-run-session and busctl, so it runs
# here too. This does not make the builder redundant: systemd units, unit ordering and a real
# reboot are still only provable on a deployed host, and scripts/vps-checks.sh remains the
# authority on the deployed system. What changed is that a daemon broken on a push is now found on
# that push.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code:
    name: workspace and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.95.0             --profile minimal             --component clippy,rustfmt             --target wasm32-unknown-unknown
          rustup default 1.95.0

      - name: Check the Rust native and WASM contracts
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check -p living-canvas --target wasm32-unknown-unknown --locked

      - name: Build the shared Rust/WASM frontend artifact
        run: |
          cargo install trunk --version 0.21.14 --locked
          cd crates/living-canvas
          trunk build --release

  desktop:
    name: the desktop in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.95.0

      # Everything under `components` is cfg(target_arch = "wasm32"), so the workspace job compiles
      # none of it. Three separate faults found on 2026-08-22 lived entirely in that half and were
      # invisible to every test that existed. This job is the half that was missing.
      - name: Install a browser and the wasm test harness
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends chromium-browser chromium-chromedriver ||             sudo apt-get install --yes --no-install-recommends chromium chromium-driver
          # Exactly the wasm-bindgen in Cargo.lock. The runner and the generated bindings must
          # agree or the harness refuses to start.
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Run the desktop interaction gate
        env:
          CHROMEDRIVER: /usr/bin/chromedriver
        run: cargo test -p living-canvas --target wasm32-unknown-unknown --locked

  integration:
    name: the Mind as a system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      # dbus-run-session is what the gate re-executes itself under; busctl is how it talks to the
      # daemons; libpam0g-dev is what cybou-authd links against.
      - name: Install the session bus and PAM headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus libpam0g-dev systemd

      - name: Run the multi-daemon integration gate
        run: bash scripts/test-multi-daemon-integration.sh

  compliance:
    name: licensing and declared documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These were carried by the Nix job and have nothing to do with what it built. Removing Nix
      # without keeping them would have quietly removed them too.
      - name: Install the compliance tools
        run: pipx install reuse

      - name: Check licensing and the authoritative documents
        run: |
          reuse lint
          python3 scripts/validate-cognitive-docs.py .
          python3 scripts/validate-desktop-styles.py
          python3 scripts/validate-organ-layering.py
          python3 scripts/validate-doc-links.py
