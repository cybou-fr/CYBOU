#
# Cybou CI — repository workflow; see docs/TESTING.md and docs/adr/ADR-0004-ci-workflow.md.
# GitHub Actions is assumed but not required; the split below is what matters:
#
#   every push  -> cheap checks only, minutes, always green or genuinely broken
#   tag         -> VM build if it fits the runner
#   ISO         -> built locally in WSL, never on a hosted runner
#
# Why the ISO is not here: hosted runners give roughly 14 GB of free disk. A NixOS
# Plasma ISO sits at or past that line, so it fails for reasons unrelated to the change
# and trains everyone to ignore red CI. docs/BUILDING.md documents WSL/Linux development;
# docs/RELEASE.md defines the manual release ISO + SHA256 step.
#
# Note there is almost nothing here. That is the point: `nix flake check` already runs
# formatting, REUSE compliance and package-metadata validation, each pinned by flake.lock,
# each reproducible with the same command on a developer machine. Re-listing them as
# separate CI steps would create a second source of truth that drifts.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: cheap checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust foundation toolchain
        run: |
          rustup toolchain install 1.95.0 \
            --profile minimal \
            --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.95.0

      - name: Check Rust native and WASM contracts
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check -p living-canvas --target wasm32-unknown-unknown --locked

      - name: Build the shared Rust/WASM frontend artifact
        run: |
          cargo install trunk --version 0.21.14 --locked
          cd crates/living-canvas
          trunk build --release

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Named explicitly rather than `nix flake check`, which would also run the headless
      # lifecycle-continuity VM and the full Plasma vm-smoke; both require KVM.
      - run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.reuse \
            .#checks.x86_64-linux.package-metadata \
            .#checks.x86_64-linux.cognitive-docs \
            .#checks.x86_64-linux.mind-access \
            .#checks.x86_64-linux.qml-api \
            .#checks.x86_64-linux.ui-polish \
            .#checks.x86_64-linux.rust-foundation \
            .#checks.x86_64-linux.web-ui \
            .#checks.x86_64-linux.desktop-shell

      # Build C++ packages to ensure they compile correctly
      - run: |
          nix build --print-build-logs \
            .#packages.x86_64-linux.cybou-mind \
            .#packages.x86_64-linux.cybou-presence-applet

      # Not covered above: catches a formatter that rewrites files.
      - run: nix fmt && git diff --exit-code

  full:
    name: full check and VM build
    if: startsWith(github.ref, 'refs/tags/')
    # Needs a KVM-capable runner for the lifecycle-continuity and vm-smoke checks. On hosted
    # runners this job will fail honestly rather than silently skipping them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
      - run: nix build .#nixosConfigurations.cybou-vm.config.system.build.vm

# Not in CI, by decision:
#   nix build .#nixosConfigurations.cybou-iso.config.system.build.isoImage
#   sha256sum result/iso/*.iso
# Run both in WSL/Linux for a release and publish the hash per docs/RELEASE.md.
