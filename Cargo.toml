[workspace]
members = [
    "crates/cybou-acp",
    "crates/cybou-authd",
    "crates/cybou-actiond",
    "crates/cybou-capsule",
    "crates/cybou-capsule-enter",
    "crates/cybou-contextd",
    "crates/cybou-crypto",
    "crates/cybou-epistemicd",
    "crates/cybou-egressd",
    "crates/cybou-egress-bridge",
    "crates/cybou-eventd",
    "crates/cybou-executord",
    "crates/cybou-fabric",
    "crates/cybou-healthd",
    "crates/cybou-host-filesd",
    "crates/cybou-identityd",
    "crates/cybou-intentiond",
    "crates/cybou-jailfs",
    "crates/cybou-lifecycled",
    "crates/cybou-meaning",
    "crates/cybou-meaningd",
    "crates/cybou-model-brokerd",
    "crates/cybou-model-bridge",
    "crates/cybou-model-gateway",
    "crates/cybou-operationd",
    "crates/cybou-agent-opencode",
    "crates/cybou-agent-gateway",
    "crates/cybou-agentd",
    "crates/cybou-provider-catalogue",
    "crates/cybou-provider-litellm",
    "crates/cybou-perception",
    "crates/cybou-perceptiond",
    "crates/cybou-predictord",
    "crates/cybou-presenced",
    "crates/cybou-protocol",
    "crates/cybou-ptyd",
    "crates/cybou-remediation",
    "crates/cybou-remediationd",
    "crates/cybou-runtime",
    "crates/cybou-selfd",
    "crates/cybou-storage",
    "crates/cybou-telemetryd",
    "crates/cybou-web-contracts",
    "crates/cybou-web-gateway",
    "crates/cybou-workspaced",
    "crates/living-canvas",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/cybou-fr/CYBOU"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
# One file transfer carries its bytes in a JSON field, so it carries them base64.
base64 = "0.22.1"
cybou-jailfs = { path = "crates/cybou-jailfs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
chacha20poly1305 = "0.10.1"
getrandom = "0.2.15"
async-trait = "0.1.92"
# `ws` is not a default feature. The terminal is the first surface here that has to talk in
# both directions at once (ADR-0047).
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls"] }
# `process` is here for one call: sending a signal without writing `unsafe` in a workspace
# that forbids it, and without shelling out to `kill`, which would be a command line in a
# place that deliberately has none.
rustix = { version = "1.1.4", features = ["fs", "process"] }
ciborium = "0.2.2"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
percent-encoding = "2.3.2"
futures-core = "0.3.31"
futures-util = "0.3.34"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
# The desktop is 7.7 MB of WebAssembly and was served as 7.7 MB. Compression is not an
# optimisation here; it is four fifths of what a person waits through before anything appears.
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
