[workspace]
members = [
    "crates/cybou-contextd",
    "crates/cybou-crypto",
    "crates/cybou-epistemicd",
    "crates/cybou-eventd",
    "crates/cybou-fabric",
    "crates/cybou-healthd",
    "crates/cybou-identityd",
    "crates/cybou-intentiond",
    "crates/cybou-lifecycled",
    "crates/cybou-perception",
    "crates/cybou-perceptiond",
    "crates/cybou-predictord",
    "crates/cybou-presenced",
    "crates/cybou-protocol",
    "crates/cybou-runtime",
    "crates/cybou-selfd",
    "crates/cybou-storage",
    "crates/cybou-web-contracts",
    "crates/cybou-web-gateway",
    "crates/cybou-workspaced",
    "crates/living-canvas",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/cybou-fr/CYBOU"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
chacha20poly1305 = "0.10.1"
getrandom = "0.2.15"
async-trait = "0.1.92"
axum = "0.8.9"
ciborium = "0.2.2"
http-body-util = "0.1.5"
futures-core = "0.3.31"
futures-util = "0.3.34"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header", "trace"] }
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
